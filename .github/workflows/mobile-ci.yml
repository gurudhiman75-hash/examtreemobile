name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate source files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Record generated-source drift
        shell: bash
        run: |
          git diff --name-only > "$RUNNER_TEMP/generated-drift.txt"
          if [[ -s "$RUNNER_TEMP/generated-drift.txt" ]]; then
            echo "Generated files changed:"
            cat "$RUNNER_TEMP/generated-drift.txt"
          else
            echo "Generated files are current."
          fi

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Android debug build
        run: flutter build apk --debug

      - name: Enforce committed generated sources
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/generated-drift.txt" ]]; then
            echo "Run build_runner locally and commit these generated files:"
            cat "$RUNNER_TEMP/generated-drift.txt"
            exit 1
          fi
