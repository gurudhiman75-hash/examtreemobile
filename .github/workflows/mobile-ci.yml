name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply final analyzer cleanups
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('lib/core/models/exam_api_dto.dart'): (
                  "String? _nullableString(Object? value) => value == null ? null : value.toString();",
                  "String? _nullableString(Object? value) => value?.toString();",
              ),
              Path('lib/features/results/presentation/results_screen.dart'): (
                  """    Future<void> refreshResults() async {
                    await ref.refresh(userResultsProvider.future);
                  }""",
                  """    Future<void> refreshResults() async {
                    ref.invalidate(userResultsProvider);
                    final refreshedResults = ref.read(userResultsProvider.future);
                    await refreshedResults;
                  }""",
              ),
              Path('test/widget_test.dart'): (
                  """  Future<List<AttemptDraft>> listDrafts() async => [
                        if (existingDraft != null) existingDraft!,
                      ];""",
                  """  Future<List<AttemptDraft>> listDrafts() async => [
                        ?existingDraft,
                      ];""",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY
          dart format \
            lib/core/models/exam_api_dto.dart \
            lib/features/results/presentation/results_screen.dart \
            test/widget_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/models/exam_api_dto.dart \
            lib/features/results/presentation/results_screen.dart \
            test/widget_test.dart
          git commit -m "fix(mobile): clear final analyzer findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate source files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Record generated-source drift
        shell: bash
        run: |
          git diff --name-only > generated-drift.txt
          git diff > generated-sources.patch
          if [[ -s generated-drift.txt ]]; then
            echo "Generated files changed:"
            cat generated-drift.txt
          else
            echo "Generated files are current."
          fi

      - name: Static analysis
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analysis.log

      - name: Unit and widget tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee tests.log

      - name: Android debug build
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee android-build.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ci-diagnostics
          if-no-files-found: ignore
          path: |
            analysis.log
            tests.log
            android-build.log
            generated-drift.txt
            generated-sources.patch

      - name: Enforce verification result
        if: always()
        shell: bash
        run: |
          failed=0
          if [[ "${{ steps.analyze.outcome }}" != "success" ]]; then
            echo "Static analysis failed."
            failed=1
          fi
          if [[ "${{ steps.tests.outcome }}" != "success" ]]; then
            echo "Flutter tests failed."
            failed=1
          fi
          if [[ "${{ steps.android_build.outcome }}" != "success" ]]; then
            echo "Android debug build failed."
            failed=1
          fi
          if [[ -s generated-drift.txt ]]; then
            echo "Generated sources are stale:"
            cat generated-drift.txt
            failed=1
          fi
          exit "$failed"
