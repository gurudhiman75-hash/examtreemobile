name: Apply safe retake route correction

on:
  push:
    branches:
      - fix/results-safe-retake-routing
    paths:
      - '.github/workflows/apply-safe-retake.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/results-safe-retake-routing
      - name: Route result retakes through exam details
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/features/results/presentation/results_screen.dart')
          text = path.read_text()
          checks = {
              "result.examId.isEmpty": 1,
              "'/test-attempt'": 1,
              "extra: result.examId,": 1,
              "label: const Text('Retake')": 1,
          }
          for needle, expected in checks.items():
              actual = text.count(needle)
              if actual != expected:
                  raise SystemExit(f'Expected {expected} occurrence of {needle!r}, found {actual}')
          text = text.replace('result.examId.isEmpty', 'result.examId.trim().isEmpty', 1)
          text = text.replace("'/test-attempt'", "'/exam-details'", 1)
          text = text.replace('extra: result.examId,', 'extra: result.examId.trim(),', 1)
          path.write_text(text)
          PY
          rm .github/workflows/apply-safe-retake.yml
      - name: Commit source-only correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/results/presentation/results_screen.dart .github/workflows/apply-safe-retake.yml
          git commit -m 'fix(results): route retakes through exam details'
          git push origin HEAD:fix/results-safe-retake-routing
