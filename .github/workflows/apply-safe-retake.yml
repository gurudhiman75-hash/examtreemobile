name: Apply safe retake route correction

on:
  push:
    branches:
      - fix/results-safe-retake-routing
    paths:
      - '.github/workflows/apply-safe-retake.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/results-safe-retake-routing
      - name: Route result retakes through exam details
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/features/results/presentation/results_screen.dart')
          text = path.read_text()
          old = """                    onPressed: result.examId.isEmpty
                        ? null
                        : () => context.push(
                              '/test-attempt',
                              extra: result.examId,
                            ),"""
          new = """                    onPressed: result.examId.trim().isEmpty
                        ? null
                        : () => context.push(
                              '/exam-details',
                              extra: result.examId.trim(),
                            ),"""
          if old not in text:
              raise SystemExit('Expected Results retake route was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/apply-safe-retake.yml
      - name: Commit source-only correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/results/presentation/results_screen.dart .github/workflows/apply-safe-retake.yml
          git commit -m 'fix(results): route retakes through exam details'
          git push origin HEAD:fix/results-safe-retake-routing
