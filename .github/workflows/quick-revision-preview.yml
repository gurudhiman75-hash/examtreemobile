name: Quick Revision preview

on:
  pull_request:
    paths:
      - 'lib/core/theme/**'
      - 'lib/features/companion/**'
      - 'test/features/companion/**'
      - '.github/workflows/quick-revision-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Stage pinned fonts for preview rendering
        run: |
          mkdir -p test/features/companion/presentation/quick_revision_previews
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf" \
            test/features/companion/presentation/quick_revision_previews/Roboto-Regular.ttf
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" \
            test/features/companion/presentation/quick_revision_previews/MaterialIcons-Regular.otf

      - name: Render Quick Revision phone previews
        run: |
          flutter test --update-goldens \
            test/features/companion/presentation/quick_revision_preview.dart

      - name: Publish Quick Revision screenshots
        uses: actions/upload-artifact@v4
        with:
          name: examtree-quick-revision-screenshots
          path: test/features/companion/presentation/quick_revision_previews/*.png
          if-no-files-found: error
          retention-days: 14
