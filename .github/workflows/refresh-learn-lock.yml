name: Refresh Learn lockfile

on:
  push:
    branches:
      - product/learn-resources-v1
    paths:
      - .github/workflows/refresh-learn-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: product/learn-resources-v1

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "Lock Learn dependencies"
          git push origin HEAD:product/learn-resources-v1
