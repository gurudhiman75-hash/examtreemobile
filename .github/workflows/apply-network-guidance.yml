name: Apply network failure guidance

on:
  push:
    branches:
      - feat/network-failure-guidance-v1
    paths:
      - '.github/workflows/apply-network-guidance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/network-failure-guidance-v1
      - name: Apply student-facing network states
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_str}: expected one occurrence, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1))

          results = 'lib/features/results/presentation/results_screen.dart'
          replace_once(
              results,
              "import '../../../core/theme/app_spacing.dart';\n",
              "import '../../../core/theme/app_spacing.dart';\nimport '../../../shared/widgets/network_failure_view.dart';\n",
          )
          replace_once(
              results,
              """        error: (error, stackTrace) => _ResultsStateView.error(
          onRetry: () => ref.invalidate(userResultsProvider),
        ),""",
              """        error: (error, stackTrace) => NetworkFailureView(
          error: error,
          fallbackTitle: 'Unable to load your attempt history',
          onRetry: () => ref.invalidate(userResultsProvider),
        ),""",
          )

          details = 'lib/features/exams/presentation/exam_details_screen.dart'
          replace_once(
              details,
              "import '../../../shared/widgets/primary_button.dart';\n",
              "import '../../../shared/widgets/network_failure_view.dart';\nimport '../../../shared/widgets/primary_button.dart';\n",
          )
          replace_once(
              details,
              "        error: (error, stackTrace) => _ExamDetailsError(onRetry: refresh),",
              """        error: (error, stackTrace) => NetworkFailureView(
          error: error,
          fallbackTitle: 'Unable to load these exam details',
          onRetry: refresh,
        ),""",
          )

          review = 'lib/features/results/presentation/review_screen.dart'
          replace_once(
              review,
              "import '../../../shared/widgets/primary_button.dart';\n",
              "import '../../../shared/widgets/network_failure_view.dart';\nimport '../../../shared/widgets/primary_button.dart';\n",
          )
          replace_once(
              review,
              """        error: (error, stackTrace) => _ReviewLoadState(
          message: 'Unable to load this result.',
          onRetry: () => ref.invalidate(resultProvider(resultId)),
        ),""",
              """        error: (error, stackTrace) => NetworkFailureView(
          error: error,
          fallbackTitle: 'Unable to load this result',
          onRetry: () => ref.invalidate(resultProvider(resultId)),
        ),""",
          )

          profile = 'lib/features/profile/presentation/profile_screen.dart'
          replace_once(
              profile,
              "import '../../../core/theme/app_spacing.dart';\n",
              "import '../../../core/theme/app_spacing.dart';\nimport '../../../shared/widgets/network_failure_view.dart';\n",
          )
          replace_once(
              profile,
              """              error: (error, stackTrace) => _AnalyticsError(
                onRetry: () => ref.invalidate(performanceAnalyticsProvider),
              ),""",
              """              error: (error, stackTrace) => NetworkFailureCard(
                error: error,
                fallbackTitle: 'Unable to load your performance',
                onRetry: () => ref.invalidate(performanceAnalyticsProvider),
              ),""",
          )
          PY
          rm .github/workflows/apply-network-guidance.yml
      - name: Commit source-only integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/results/presentation/results_screen.dart \
                  lib/features/exams/presentation/exam_details_screen.dart \
                  lib/features/results/presentation/review_screen.dart \
                  lib/features/profile/presentation/profile_screen.dart \
                  .github/workflows/apply-network-guidance.yml
          git commit -m 'feat(network): show actionable failure guidance across student screens'
          git push origin HEAD:feat/network-failure-guidance-v1
