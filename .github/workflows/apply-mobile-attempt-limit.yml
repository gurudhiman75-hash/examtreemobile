name: Apply mobile attempt limit integration

on:
  push:
    branches:
      - feat/attempt-resilience-completion-v3
    paths:
      - '.github/workflows/apply-mobile-attempt-limit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attempt-resilience-completion-v3
      - name: Apply mobile attempt limit patch
        run: python tool/attempt_limit_mobile_patch.py
      - name: Commit source changes
        run: |
          rm tool/attempt_limit_mobile_patch.py .github/workflows/apply-mobile-attempt-limit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/models/exam_api_dto.dart \
                  lib/features/exams/presentation/exam_details_screen.dart \
                  lib/features/test_attempt/presentation/canonical_test_attempt_screen.dart \
                  tool/attempt_limit_mobile_patch.py .github/workflows/apply-mobile-attempt-limit.yml
          git commit -m 'feat(attempt): surface canonical attempt limits'
          git push origin HEAD:feat/attempt-resilience-completion-v3
