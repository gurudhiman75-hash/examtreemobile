name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID || vars.FIREBASE_ANDROID_APP_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Stage pinned fonts for golden rendering
        run: |
          mkdir -p test/features/home/presentation/goldens
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf" \
            test/features/home/presentation/goldens/Roboto-Regular.ttf
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" \
            test/features/home/presentation/goldens/MaterialIcons-Regular.otf

      - name: Verify Firebase Android build configuration
        id: firebase_config
        continue-on-error: true
        shell: bash
        run: |
          if [[ -z "${FIREBASE_ANDROID_APP_ID:-}" ]]; then
            echo "::error::FIREBASE_ANDROID_APP_ID is missing. Configure it as a repository secret or variable before publishing an APK."
            exit 1
          fi
          if [[ ! "$FIREBASE_ANDROID_APP_ID" =~ ^1:1083299267005:android:[[:alnum:]]+$ ]]; then
            echo "::error::FIREBASE_ANDROID_APP_ID does not match the sarbedutech Android app-id format."
            exit 1
          fi
          echo "Firebase Android build configuration is present."

      - name: Analyse
        id: analyse
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos > flutter-analyse.log 2>&1
          status=$?
          cat flutter-analyse.log
          exit $status

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          flutter test > flutter-test.log 2>&1
          status=$?
          cat flutter-test.log
          exit $status

      - name: Build Android debug APK
        id: android_build
        if: steps.firebase_config.outcome == 'success'
        continue-on-error: true
        run: |
          flutter build apk --debug \
            --dart-define=EXAMTREE_API_BASE_URL=https://examtree-new.onrender.com/api \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            > flutter-build.log 2>&1
          status=$?
          cat flutter-build.log
          exit $status

      - name: Upload Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-diagnostics
          path: |
            flutter-analyse.log
            flutter-test.log
            flutter-build.log
          if-no-files-found: warn

      - name: Enforce verification result
        if: always()
        run: |
          test "${{ steps.firebase_config.outcome }}" = "success"
          test "${{ steps.analyse.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.android_build.outcome }}" = "success"
