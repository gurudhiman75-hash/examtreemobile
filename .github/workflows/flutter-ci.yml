name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Stage pinned fonts for Home widget coverage
        run: |
          mkdir -p test/features/home/presentation/goldens
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf" \
            test/features/home/presentation/goldens/Roboto-Regular.ttf
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" \
            test/features/home/presentation/goldens/MaterialIcons-Regular.otf

      - name: Analyse
        id: analyse
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos > flutter-analyse.log 2>&1
          status=$?
          cat flutter-analyse.log
          exit $status

      - name: Run non-golden tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t test_files < <(
            find test -type f -name '*_test.dart' \
              ! -path '*/home_screen_golden_test.dart' \
              | sort
          )
          flutter test "${test_files[@]}" > flutter-test.log 2>&1
          status=$?
          cat flutter-test.log
          exit $status

      - name: Upload Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-diagnostics
          path: |
            flutter-analyse.log
            flutter-test.log
          if-no-files-found: warn

      - name: Enforce verification result
        if: always()
        run: |
          test "${{ steps.analyse.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
