name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate model sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyse
        id: analyse
        continue-on-error: true
        run: |
          flutter analyze > flutter-analyse.log 2>&1
          status=$?
          cat flutter-analyse.log
          exit $status

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          flutter test > flutter-test.log 2>&1
          status=$?
          cat flutter-test.log
          exit $status

      - name: Build Android debug APK
        id: android_build
        continue-on-error: true
        run: |
          flutter build apk --debug \
            --dart-define=EXAMTREE_API_BASE_URL=https://examtree-new.onrender.com/api \
            > flutter-build.log 2>&1
          status=$?
          cat flutter-build.log
          exit $status

      - name: Upload Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-diagnostics
          path: |
            flutter-analyse.log
            flutter-test.log
            flutter-build.log
            lib/core/models/question_model.freezed.dart
            lib/core/models/question_model.g.dart
          if-no-files-found: warn

      - name: Enforce verification result
        if: always()
        run: |
          test "${{ steps.analyse.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.android_build.outcome }}" = "success"
