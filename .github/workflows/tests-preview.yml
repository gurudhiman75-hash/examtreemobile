name: Tests catalogue preview

on:
  pull_request:
    paths:
      - 'lib/core/theme/**'
      - 'lib/features/exams/**'
      - 'test/features/exams/**'
      - '.github/workflows/tests-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Stage pinned fonts for preview rendering
        run: |
          mkdir -p test/features/exams/presentation/previews
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf" \
            test/features/exams/presentation/previews/Roboto-Regular.ttf
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" \
            test/features/exams/presentation/previews/MaterialIcons-Regular.otf

      - name: Render Tests phone previews
        run: |
          flutter test --update-goldens \
            test/features/exams/presentation/tests_catalogue_preview.dart

      - name: Publish Tests screenshots
        uses: actions/upload-artifact@v4
        with:
          name: examtree-tests-catalogue-screenshots
          path: test/features/exams/presentation/previews/tests_*.png
          if-no-files-found: error
          retention-days: 14
