name: Apply attempt resilience follow-up

on:
  push:
    branches:
      - feat/attempt-resilience-completion-v3
    paths:
      - '.github/workflows/apply-attempt-resilience-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attempt-resilience-completion-v3
      - name: Apply follow-up patch
        run: python tool/attempt_resilience_followup.py
      - name: Commit follow-up
        run: |
          rm tool/attempt_resilience_followup.py .github/workflows/apply-attempt-resilience-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/test_attempt/presentation/canonical_test_attempt_screen.dart tool/attempt_resilience_followup.py .github/workflows/apply-attempt-resilience-followup.yml
          git commit -m 'fix(attempt): harden recovery and queued saves'
          git push origin HEAD:feat/attempt-resilience-completion-v3
