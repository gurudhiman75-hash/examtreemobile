name: Commit Companion Lock

on:
  push:
    branches:
      - feat/mobile-daily-companion-v1
    paths:
      - '.github/workflows/commit-companion-lock.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-daily-companion-v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Commit lockfile
        run: |
          rm .github/workflows/commit-companion-lock.yml
          rm .github/workflows/capture-companion-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock .github/workflows/commit-companion-lock.yml .github/workflows/capture-companion-lock.yml
          git commit -m 'build(companion): lock notification dependencies'
          git push origin HEAD:feat/mobile-daily-companion-v1
