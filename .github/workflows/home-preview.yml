name: Home visual preview

on:
  pull_request:
    paths:
      - 'lib/core/theme/**'
      - 'lib/features/home/**'
      - 'test/features/home/**'
      - '.github/workflows/home-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID || vars.FIREBASE_ANDROID_APP_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Stage pinned fonts for golden rendering
        run: |
          mkdir -p test/features/home/presentation/goldens
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf" \
            test/features/home/presentation/goldens/Roboto-Regular.ttf
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" \
            test/features/home/presentation/goldens/MaterialIcons-Regular.otf

      - name: Render home phone previews
        run: |
          flutter test --update-goldens \
            test/features/home/presentation/home_screen_golden_test.dart

      - name: Publish home screenshots
        uses: actions/upload-artifact@v4
        with:
          name: examtree-home-command-centre-screenshots
          path: test/features/home/presentation/goldens/home_*.png
          if-no-files-found: error
          retention-days: 14

      - name: Verify Firebase Android build configuration
        shell: bash
        run: |
          if [[ -z "${FIREBASE_ANDROID_APP_ID:-}" ]]; then
            echo "::error::FIREBASE_ANDROID_APP_ID is missing. Configure it as a repository secret or variable before publishing an APK."
            exit 1
          fi
          if [[ ! "$FIREBASE_ANDROID_APP_ID" =~ ^1:1083299267005:android:[[:alnum:]]+$ ]]; then
            echo "::error::FIREBASE_ANDROID_APP_ID does not match the sarbedutech Android app-id format."
            exit 1
          fi

      - name: Build installable preview APK
        run: |
          flutter build apk --debug \
            --dart-define=EXAMTREE_API_BASE_URL=https://examtree-new.onrender.com/api \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"

      - name: Publish installable preview APK
        uses: actions/upload-artifact@v4
        with:
          name: examtree-home-command-centre-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
