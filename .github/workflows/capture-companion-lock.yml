name: Capture Companion Lock

on:
  push:
    branches:
      - feat/mobile-daily-companion-v1
    paths:
      - '.github/workflows/capture-companion-lock.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Print resolved lock
        run: |
          echo '---EXAMTREE_LOCK_BEGIN---'
          cat pubspec.lock
          echo '---EXAMTREE_LOCK_END---'
