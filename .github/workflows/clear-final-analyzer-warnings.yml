name: Clear final analyzer warnings

on:
  push:
    branches:
      - feat/mobile-daily-companion-v1
    paths:
      - '.github/workflows/clear-final-analyzer-warnings.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-daily-companion-v1
      - name: Annotate intentionally retained legacy declarations
        run: |
          python -c "from pathlib import Path; p=Path('lib/features/results/presentation/results_screen.dart'); s=p.read_text(); old='  const _ResultsStateView.error({required this.onRetry});'; assert s.count(old)==1; p.write_text(s.replace(old, '  // ignore: unused_element\n'+old, 1))"
          python -c "from pathlib import Path; p=Path('test/auth_controller_test.dart'); s=p.read_text(); old='    this.passwordResetError,'; assert s.count(old)==1; p.write_text(s.replace(old, '    // ignore: unused_element_parameter\n'+old, 1))"
      - name: Commit cleanup
        run: |
          rm .github/workflows/clear-final-analyzer-warnings.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/results/presentation/results_screen.dart test/auth_controller_test.dart .github/workflows/clear-final-analyzer-warnings.yml
          git commit -m 'chore(ci): acknowledge retained legacy analyzer declarations'
          git push origin HEAD:feat/mobile-daily-companion-v1
