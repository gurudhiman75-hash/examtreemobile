name: Authenticated Android APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/authenticated-android-apk.yml'
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    paths:
      - '.github/workflows/authenticated-android-apk.yml'
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID || vars.FIREBASE_ANDROID_APP_ID || '1:1083299267005:android:3986910db48dd12e3ad2d4' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: examtree-android-debug-keystore-v1

      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storetype JKS \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$HOME/.android/debug.keystore"
          KEY_SHA1="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA1: //p' \
            | head -n 1 \
            | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$KEY_SHA1" =~ ^([0-9A-F]{2}:){19}[0-9A-F]{2}$ ]]; then
            echo "::error::Unable to determine cached debug-keystore SHA-1."
            exit 1
          fi
          echo "Cached debug-keystore SHA-1: $KEY_SHA1"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Firebase Android build configuration
        shell: bash
        run: |
          if [[ -z "${FIREBASE_ANDROID_APP_ID:-}" ]]; then
            echo "::error::FIREBASE_ANDROID_APP_ID is missing. Register com.examtree.examtree in Firebase project sarbedutech and configure the generated App ID as a GitHub Actions repository variable or secret."
            exit 1
          fi
          if [[ ! "$FIREBASE_ANDROID_APP_ID" =~ ^1:1083299267005:android:[[:alnum:]]+$ ]]; then
            echo "::error::FIREBASE_ANDROID_APP_ID does not match the sarbedutech Android app-id format."
            exit 1
          fi
          echo "Firebase Android build configuration is present."

      - name: Verify Firebase options consume the build definition
        shell: bash
        run: |
          cat > test/_firebase_android_build_config_ci_test.dart <<'DART'
          import 'package:examtree/firebase_options.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('authenticated Android build receives the registered Firebase App ID', () {
              const appId = String.fromEnvironment('FIREBASE_ANDROID_APP_ID');
              final configuration = DefaultFirebaseOptions.forValues(
                platform: FirebaseClientPlatform.android,
                androidAppId: appId,
              );

              expect(appId, startsWith('1:1083299267005:android:'));
              expect(configuration.isConfigured, isTrue);
              expect(configuration.options?.appId, appId);
              expect(configuration.options?.projectId, 'sarbedutech');
              expect(configuration.options?.messagingSenderId, '1083299267005');
            });
          }
          DART
          flutter test \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            test/_firebase_android_build_config_ci_test.dart
          rm test/_firebase_android_build_config_ci_test.dart

      - name: Build authenticated Android debug APK
        shell: bash
        run: |
          BUILD_NUMBER="$(date -u +%y%m%d%H)"
          echo "Building ExamTree 1.0.1 ($BUILD_NUMBER)"
          flutter build apk --debug \
            --build-name=1.0.1 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=EXAMTREE_API_BASE_URL=https://examtree-new.onrender.com/api \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/flutter-apk/ExamTree-1.0.1-auth-debug.apk

      - name: Verify APK signing fingerprint
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/ExamTree-1.0.1-auth-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Unable to locate apksigner in the Android SDK."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" > build/app/outputs/flutter-apk/signing-certs.txt
          RAW_APK_SHA1="$(sed -n 's/^.*certificate SHA-1 digest: //p' build/app/outputs/flutter-apk/signing-certs.txt | head -n 1)"
          if [[ ! "$RAW_APK_SHA1" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Unable to determine Android signing SHA-1 from the built APK."
            cat build/app/outputs/flutter-apk/signing-certs.txt
            exit 1
          fi
          APK_SHA1="$(printf '%s' "$RAW_APK_SHA1" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"

          KEY_SHA1="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA1: //p' \
            | head -n 1 \
            | tr '[:lower:]' '[:upper:]')"

          echo "Cached debug-keystore SHA-1: $KEY_SHA1"
          echo "APK signing SHA-1:           $APK_SHA1"
          if [[ "$APK_SHA1" != "$KEY_SHA1" ]]; then
            echo "::error::Authenticated APK was not signed by the cached debug keystore."
            exit 1
          fi

          printf '%s\n' "$APK_SHA1" > build/app/outputs/flutter-apk/signing-sha1.txt

      - name: Publish authenticated Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamTree-1.0.1-auth-debug
          path: |
            build/app/outputs/flutter-apk/ExamTree-1.0.1-auth-debug.apk
            build/app/outputs/flutter-apk/signing-sha1.txt
          if-no-files-found: error
          retention-days: 14
