name: Apply attempt resilience integration

on:
  push:
    branches:
      - feat/attempt-resilience-completion-v3
    paths:
      - '.github/workflows/apply-attempt-resilience.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attempt-resilience-completion-v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply resilience patch
        run: python tool/attempt_resilience_patch.py
      - name: Refresh dependencies
        run: flutter pub get
      - name: Commit source integration
        run: |
          rm tool/attempt_resilience_patch.py .github/workflows/apply-attempt-resilience.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock lib/features/test_attempt/presentation/canonical_test_attempt_screen.dart lib/features/test_attempt/presentation/widgets/test_attempt_dialogs.dart tool/attempt_resilience_patch.py .github/workflows/apply-attempt-resilience.yml
          git commit -m 'feat(attempt): complete offline and timing resilience'
          git push origin HEAD:feat/attempt-resilience-completion-v3
