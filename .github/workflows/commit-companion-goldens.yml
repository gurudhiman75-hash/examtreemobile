name: Commit Companion Goldens

on:
  push:
    branches:
      - feat/mobile-daily-companion-v1
    paths:
      - '.github/workflows/commit-companion-goldens.yml'

permissions:
  contents: write

jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-daily-companion-v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Stage pinned fonts
        run: |
          mkdir -p test/features/home/presentation/goldens
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf" test/features/home/presentation/goldens/Roboto-Regular.ttf
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" test/features/home/presentation/goldens/MaterialIcons-Regular.otf
      - name: Render reviewed baselines
        run: flutter test --update-goldens test/features/home/presentation/home_screen_golden_test.dart
      - name: Commit baselines
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/home-preview.yml > .github/workflows/home-preview.yml
          rm .github/workflows/commit-companion-goldens.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/features/home/presentation/goldens/home_*.png .github/workflows/home-preview.yml .github/workflows/commit-companion-goldens.yml
          git commit -m 'test(home): refresh pinned renderer baselines'
          git push origin HEAD:feat/mobile-daily-companion-v1
