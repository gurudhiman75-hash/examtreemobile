name: examtree
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.1.0
  go_router: ^17.3.0
  dio: 5.9.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_crashlytics: ^5.2.7
  firebase_remote_config: ^6.5.6
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.0.5
  google_sign_in: ^7.2.0
  sqflite: ^2.4.3
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.12
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/licenses/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_400Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans_700Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans_800ExtraBold.ttf
          weight: 800
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari_700Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansDevanagari_800ExtraBold.ttf
          weight: 800
    - family: NotoSansGurmukhi
      fonts:
        - asset: assets/fonts/NotoSansGurmukhi_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansGurmukhi_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansGurmukhi_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansGurmukhi_700Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansGurmukhi_800ExtraBold.ttf
          weight: 800
